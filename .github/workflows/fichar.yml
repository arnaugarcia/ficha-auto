name: Fichaje automatico Ficha.Work

on:
  schedule:
    # 09:00 y 17:00 hora de Madrid/Barcelona (verano UTC+2)
    # En invierno (UTC+1) cambiar a: '0 8 * * 1-5' y '0 16 * * 1-5'
    - cron: '0 7 * * 1-5'   # 09:00 CEST
    - cron: '0 15 * * 1-5'  # 17:00 CEST
  workflow_dispatch:

jobs:
  fichar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ejecutar el script de fichaje
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: node fichawork.js
